[workspace]
members = [
    "crates/deskcraft-store",
    "crates/deskcraft-core",
    "crates/deskcraft-mcp",
    "crates/deskcraft-app",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sandraschi fleet"]
repository = "https://github.com/sandraschi/deskcraft"

[workspace.dependencies]
craft-biz = { path = "../craft-biz/crates/craft-biz" }
craft-biz-ui = { path = "../craft-biz/crates/craft-biz-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
egui = { version = "0.37.0", default-features = false }
mail-parser = "0.11"
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
